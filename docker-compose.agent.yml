services:
  agent:
    image: python:3.12-slim
    container_name: setupimpa-agent
    working_dir: /opt/setupimpa/agent
    command: >
      bash -c "pip install -q fastapi uvicorn[standard] pydantic httpx docker PyYAML jinja2
      && python -m uvicorn app:app --host 0.0.0.0 --port 8877"
    ports:
      - "${SETUPIMPA_PORT:-8877}:8877"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root:/root
      - /opt/setupimpa:/opt/setupimpa
      - /var/log:/var/log
    environment:
      - SETUPIMPA_TOKEN=${SETUPIMPA_TOKEN}
      - SETUPIMPA_NETWORK=${SETUPIMPA_NETWORK:-network_public}
      - SETUPIMPA_PUBLIC_IP=${SETUPIMPA_PUBLIC_IP:-}
      - SETUPIMPA_VERSION=${SETUPIMPA_VERSION:-0.1.0}
    restart: unless-stopped
